
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodieHub | Online Food Ordering</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fffaf3;
    color: #292929;
}

header {
    background: #ffffff;
    padding: 20px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 3px 15px #00000012;
}

.logo {
    font-size: 27px;
    font-weight: bold;
    color: #ff5722;
}

nav a {
    text-decoration: none;
    margin-left: 25px;
    color: #333;
    font-weight: bold;
}

nav a:hover {
    color: #ff5722;
}

.hero {
    padding: 85px 8%;
    background: linear-gradient(120deg, #fff0dc, #ffe0c2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 30px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #ff5722;
}

.hero p {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.7;
}

.hero button, .order-btn {
    background: #ff5722;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 16px;
}

.hero button:hover, .order-btn:hover {
    background: #d84315;
    transform: scale(1.05);
}

.hero-food {
    font-size: 170px;
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
}

.menu {
    padding: 60px 8%;
    text-align: center;
}

.menu h2 {
    font-size: 35px;
    margin-bottom: 12px;
}

.menu > p {
    color: #777;
    margin-bottom: 25px;
}

#search {
    padding: 13px;
    width: min(100%, 350px);
    border: 1px solid #ddd;
    border-radius: 25px;
    outline: none;
    margin-bottom: 30px;
}

.food-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
}

.food-card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 5px 20px #00000010;
    transition: 0.3s;
    animation: appear 0.7s ease;
}

.food-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 12px 25px #ff572233;
}

.food-image {
    font-size: 85px;
    margin-bottom: 15px;
}

.food-card h3 {
    margin-bottom: 10px;
}

.price {
    color: #ff5722;
    font-weight: bold;
    margin: 12px;
    font-size: 20px;
}

.food-card button {
    background: #ff5722;
    color: white;
    border: none;
    padding: 11px 20px;
    border-radius: 25px;
    cursor: pointer;
}

.food-card button:hover {
    background: #d84315;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.cart {
    background: #fff0e8;
    padding: 45px 8%;
}

.cart h2 {
    margin-bottom: 20px;
}

.cart-item {
    background: white;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.cart-item button {
    padding: 5px 10px;
    border: none;
    background: #ff5722;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.total {
    font-size: 23px;
    font-weight: bold;
    margin: 20px 0;
}

footer {
    text-align: center;
    padding: 25px;
    background: #292929;
    color: white;
}

#message {
    position: fixed;
    bottom: 25px;
    right: 25px;
    background: #292929;
    color: white;
    padding: 15px 22px;
    border-radius: 10px;
    display: none;
    z-index: 20;
}
</style>
</head>

<body>

<header>
    <div class="logo">🍔 FoodieHub</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#cart">Cart 🛒 <span id="count">0</span></a>
    </nav>
</header>

<section class="hero" id="home">
    <div>
        <h1>Delicious Food,<br>
        <span>Delivered Fast!</span></h1>
        <p>Discover delicious meals and order your favourites<br>
        from the comfort of your home.</p>
        <button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">
            Explore Menu →
        </button>
    </div>
    <div class="hero-food">🍕</div>
</section>

<section class="menu" id="menu">
    <h2>Explore Our Menu</h2>
    <p>Choose your favourite food and enjoy!</p>

    <input type="text" id="search"
    placeholder="🔍 Search your favourite food..."
    oninput="searchFood()">

    <div class="food-container" id="foodContainer"></div>
</section>

<section class="cart" id="cart">
    <h2>🛒 Your Shopping Cart</h2>
    <div id="cartItems">Your cart is empty!</div>

    <div class="total">
        Total: ₹<span id="total">0</span>
    </div>

    <button class="order-btn" onclick="placeOrder()">
        Place Order →
    </button>
</section>

<footer>
    <p>© 2026 FoodieHub | Made with ❤️</p>
</footer>

<div id="message"></div>

<script>

const foods = [
    {id:1, name:"Chicken Biryani", price:250, emoji:"🍛"},
    {id:2, name:"Pizza", price:200, emoji:"🍕"},
    {id:3, name:"Burger", price:120, emoji:"🍔"},
    {id:4, name:"French Fries", price:100, emoji:"🍟"},
    {id:5, name:"Sandwich", price:90, emoji:"🥪"},
    {id:6, name:"Ice Cream", price:80, emoji:"🍨"},
    {id:7, name:"Noodles", price:150, emoji:"🍜"},
    {id:8, name:"Cake", price:180, emoji:"🍰"}
];

let cart = {};

function displayFood(items) {
    const container = document.getElementById("foodContainer");
    container.innerHTML = "";

    items.forEach(food => {
        container.innerHTML += `
        <div class="food-card">
            <div class="food-image">${food.emoji}</div>
            <h3>${food.name}</h3>
            <p>Fresh and delicious food!</p>
            <div class="price">₹${food.price}</div>
            <button onclick="addToCart(${food.id})">
                Add to Cart +
            </button>
        </div>`;
    });

    if(items.length === 0) {
        container.innerHTML = "<p>No food items found.</p>";
    }
}

function addToCart(id) {
    cart[id] = (cart[id] || 0) + 1;
    updateCart();
    showMessage("Food added to cart! 🍔");
}

function changeQuantity(id, amount) {
    cart[id] += amount;

    if(cart[id] <= 0) {
        delete cart[id];
    }

    updateCart();
}

function updateCart() {
    const cartItems = document.getElementById("cartItems");
    let total = 0;
    let count = 0;

    cartItems.innerHTML = "";

    for(let id in cart) {
        const food = foods.find(f => f.id == id);
        const quantity = cart[id];

        total += food.price * quantity;
        count += quantity;

        cartItems.innerHTML += `
        <div class="cart-item">
            <span>${food.emoji} ${food.name}</span>
            <span>
                <button onclick="changeQuantity(${id},-1)">−</button>
                ${quantity}
                <button onclick="changeQuantity(${id},1)">+</button>
            </span>
            <strong>₹${food.price * quantity}</strong>
        </div>`;
    }

    if(count === 0) {
        cartItems.innerHTML = "Your cart is empty!";
    }

    document.getElementById("total").innerText = total;
    document.getElementById("count").innerText = count;
}

function searchFood() {
    const value = document.getElementById("search")
    .value.toLowerCase();

    const result = foods.filter(food =>
        food.name.toLowerCase().includes(value)
    );

    displayFood(result);
}

function showMessage(text) {
    const message = document.getElementById("message");
    message.innerText = text;
    message.style.display = "block";

    setTimeout(() => {
        message.style.display = "none";
    }, 2000);
}

function placeOrder() {
    if(Object.keys(cart).length === 0) {
        showMessage("Please add food to your cart!");
        return;
    }

    alert("Order placed successfully! 🎉");
    cart = {};
    updateCart();
}

displayFood(foods);
updateCart();

</script>

</body>
</html>
